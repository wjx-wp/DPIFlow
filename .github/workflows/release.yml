name: Release

on:
  push:
    branches: [ main ]
    paths:
      - VERSION
      - 'src/**'
      - 'browser-extension/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $tag = (Get-Content VERSION -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION value: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($tag -match '-') { "prerelease=true" >> $env:GITHUB_OUTPUT } else { "prerelease=false" >> $env:GITHUB_OUTPUT }

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; nothing to publish."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Build
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: msbuild DPIFlow.sln /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Verify binary
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $exe = 'src/DPIFlow/bin/Release/DPIFlow.exe'
          if (-not (Test-Path $exe)) { throw "DPIFlow.exe was not produced" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Prepare assets
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $exe = 'src/DPIFlow/bin/Release/DPIFlow.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DPIFlow.exe" | Set-Content 'DPIFlow.exe.sha256' -Encoding ascii
          Compress-Archive -Path 'browser-extension/*' -DestinationPath 'DPIFlow-Browser-Companion.zip' -Force

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            src/DPIFlow/bin/Release/DPIFlow.exe
            DPIFlow.exe.sha256
            DPIFlow-Browser-Companion.zip
