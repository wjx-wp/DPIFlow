name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release
        shell: pwsh
        run: msbuild DPIFlow.sln /m /p:Configuration=Release /p:Platform="Any CPU"
      - name: Verify binary
        shell: pwsh
        run: |
          $exe = 'src/DPIFlow/bin/Release/DPIFlow.exe'
          if (-not (Test-Path $exe)) { throw "DPIFlow.exe was not produced" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DPIFlow-win
          path: src/DPIFlow/bin/Release/DPIFlow.exe
          if-no-files-found: error
